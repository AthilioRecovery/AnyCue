<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="AnyCue concept preview: settings screen">
  <defs>
    <g id="on"><rect width="48" height="26" rx="13" fill="#FFB020"/><circle cx="35" cy="13" r="9" fill="#0D0E12"/></g>
    <g id="off"><rect width="48" height="26" rx="13" fill="#262A34"/><circle cx="13" cy="13" r="9" fill="#8B90A0"/></g>
  </defs>
  <rect width="1280" height="800" rx="16" fill="#0D0E12"/>
  <rect x="1" y="1" width="1278" height="798" rx="15" fill="none" stroke="#262A34" stroke-width="2"/>
  <rect x="1" y="1" width="1278" height="48" rx="15" fill="#14161C"/><rect x="1" y="30" width="1278" height="19" fill="#14161C"/>
  <circle cx="28" cy="25" r="6" fill="#262A34"/><circle cx="50" cy="25" r="6" fill="#262A34"/><circle cx="72" cy="25" r="6" fill="#262A34"/>
  <text x="104" y="31" font-size="17" font-weight="700" fill="#E8EAF0">AnyCue</text>
  <text x="196" y="31" font-size="14" fill="#8B90A0">/ Settings</text>

  <!-- nav -->
  <rect x="1" y="49" width="250" height="750" fill="#111318"/>
  <line x1="251" y1="49" x2="251" y2="799" stroke="#262A34" stroke-width="2"/>
  <rect x="20" y="68" width="212" height="40" rx="12" fill="#14161C" stroke="#262A34"/>
  <text x="40" y="93" font-size="14" fill="#8B90A0">Search settings…</text>
  <g font-size="15" fill="#B7BBC8">
    <text x="40" y="150">General</text>
    <rect x="12" y="164" width="226" height="40" rx="10" fill="#1A1D25"/><rect x="12" y="172" width="4" height="24" rx="2" fill="#FFB020"/>
    <text x="40" y="190" fill="#E8EAF0" font-weight="600">Audio</text>
    <text x="40" y="232">Hotkeys</text>
    <text x="40" y="272">Auto Keys</text>
    <text x="40" y="312">Profiles</text>
    <text x="40" y="352">Automation API</text>
    <text x="40" y="392">Language</text>
    <text x="40" y="432">Diagnostics</text>
  </g>

  <!-- content -->
  <text x="296" y="108" font-size="30" font-weight="800" fill="#E8EAF0">Audio</text>
  <text x="296" y="134" font-size="14" fill="#8B90A0">Quality, timing and routing behavior for the active profile.</text>

  <rect x="296" y="160" width="940" height="560" rx="16" fill="#14161C" stroke="#262A34" stroke-width="2"/>
  <g stroke="#262A34" stroke-width="1.5">
    <line x1="320" y1="240" x2="1212" y2="240"/><line x1="320" y1="320" x2="1212" y2="320"/><line x1="320" y1="400" x2="1212" y2="400"/><line x1="320" y1="480" x2="1212" y2="480"/><line x1="320" y1="560" x2="1212" y2="560"/><line x1="320" y1="640" x2="1212" y2="640"/>
  </g>

  <g font-size="17" font-weight="600" fill="#E8EAF0">
    <text x="320" y="196">Normalize loudness</text>
    <text x="320" y="276">Target loudness</text>
    <text x="320" y="356">Block voice while a sound plays on mic</text>
    <text x="320" y="436">Mic delay</text>
    <text x="320" y="516">Duck other Windows sounds</text>
    <text x="320" y="596">Latency mode</text>
    <text x="320" y="676">Noise gate</text>
  </g>
  <g font-size="13" fill="#8B90A0">
    <text x="320" y="218">Keeps every sound at a similar perceived volume.</text>
    <text x="320" y="298">Loudness the normalizer aims for.</text>
    <text x="320" y="378">Lowers your real voice so the sound is clearer.</text>
    <text x="320" y="458">Gives push-to-talk time to open before the sound starts.</text>
    <text x="320" y="538">Reduces other audio while sounds play.</text>
    <text x="320" y="618">Smaller buffers mean lower latency but less stability.</text>
    <text x="320" y="698">Cuts background noise below a threshold.</text>
  </g>

  <!-- controls -->
  <use href="#on" x="1148" y="178"/>
  <!-- slider -16 LUFS -->
  <rect x="940" y="266" width="200" height="6" rx="3" fill="#262A34"/><rect x="940" y="266" width="120" height="6" rx="3" fill="#FFB020"/><circle cx="1060" cy="269" r="10" fill="#E8EAF0"/>
  <text x="1212" y="276" font-size="14" fill="#E8EAF0" text-anchor="end" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">-16 LUFS</text>
  <use href="#off" x="1148" y="338"/>
  <!-- slider delay -->
  <rect x="940" y="426" width="200" height="6" rx="3" fill="#262A34"/><rect x="940" y="426" width="64" height="6" rx="3" fill="#FFB020"/><circle cx="1004" cy="429" r="10" fill="#E8EAF0"/>
  <text x="1212" y="436" font-size="14" fill="#E8EAF0" text-anchor="end" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">120 ms</text>
  <use href="#off" x="1148" y="498"/>
  <!-- segmented -->
  <rect x="940" y="574" width="272" height="36" rx="10" fill="#0D0E12" stroke="#262A34"/>
  <rect x="1030" y="578" width="92" height="28" rx="8" fill="#FFB020"/>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="988" y="596" fill="#B7BBC8">Minimal</text><text x="1076" y="596" fill="#0D0E12">Balanced</text><text x="1168" y="596" fill="#B7BBC8">Safe</text>
  </g>
  <use href="#on" x="1148" y="658"/>

  <rect x="296" y="738" width="940" height="40" rx="12" fill="none" stroke="#262A34" stroke-dasharray="5 5"/>
  <text x="766" y="763" font-size="13" fill="#8B90A0" text-anchor="middle">All settings are saved to a readable config.toml · Import / Export</text>
  <text x="1256" y="788" font-size="11" fill="#5B6070" text-anchor="end">Concept preview, not the final UI</text>
</svg>
