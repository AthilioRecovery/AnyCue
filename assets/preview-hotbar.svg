    <text x="314" y="423">F5</text><text x="562" y="423">F6</text><text x="810" y="423">F7</text><text x="1058" y="423">F8</text>
    <text x="314" y="593">F9</text><text x="562" y="593">F10</text><text x="810" y="593">F11</text><text x="1058" y="593">F12</text>
  </g>

