  <rect x="1" y="639" width="1278" height="20" fill="#111318"/>
  <line x1="1" y1="639" x2="1279" y2="639" stroke="#262A34" stroke-width="2"/>
  <circle cx="300" cy="715" r="28" fill="#FFB020"/>
  <rect x="290" y="702" width="7" height="26" rx="2" fill="#0D0E12"/><rect x="303" y="702" width="7" height="26" rx="2" fill="#0D0E12"/>
  <circle cx="366" cy="715" r="20" fill="#1A1D25" stroke="#262A34"/><rect x="358" y="707" width="16" height="16" rx="3" fill="#B7BBC8"/>
  <text x="270" y="772" font-size="13" fill="#8B90A0" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">Applause · 00:02 / 00:05</text>

