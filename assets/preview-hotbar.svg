  </g>
  <g font-size="12" fill="#8B90A0" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
    <text x="288" y="184">MIC + SPK</text><text x="536" y="184" fill="#FFB020">PLAYING</text><text x="784" y="184">MIC</text><text x="1032" y="184">SPK</text>
    <text x="288" y="354">MIC + SPK</text><text x="536" y="354">MIC</text><text x="784" y="354">MIC + SPK</text><text x="1032" y="354">SPK</text>
    <text x="288" y="524">MIC</text><text x="536" y="524">MIC + SPK</text><text x="784" y="524">SPK</text><text x="1032" y="524">MIC + SPK</text>
  </g>
  <g>
    <use href="#chip" x="288" y="236"/><use href="#chip" x="536" y="226"/><use href="#chip" x="784" y="236"/><use href="#chip" x="1032" y="236"/>
    <use href="#chip" x="288" y="406"/><use href="#chip" x="536" y="406"/><use href="#chip" x="784" y="406"/><use href="#chip" x="1032" y="406"/>
    <use href="#chip" x="288" y="576"/><use href="#chip" x="536" y="576"/><use href="#chip" x="784" y="576"/><use href="#chip" x="1032" y="576"/>
  </g>
