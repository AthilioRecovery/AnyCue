  </g>
  <g fill="#262A34">
    <rect x="574" y="690" width="6" height="50" rx="3"/><rect x="586" y="678" width="6" height="74" rx="3"/><rect x="598" y="696" width="6" height="38" rx="3"/><rect x="610" y="670" width="6" height="90" rx="3"/><rect x="622" y="686" width="6" height="58" rx="3"/><rect x="634" y="700" width="6" height="30" rx="3"/><rect x="646" y="680" width="6" height="70" rx="3"/><rect x="658" y="692" width="6" height="46" rx="3"/><rect x="670" y="674" width="6" height="82" rx="3"/><rect x="682" y="698" width="6" height="34" rx="3"/><rect x="694" y="686" width="6" height="58" rx="3"/><rect x="706" y="704" width="6" height="22" rx="3"/><rect x="718" y="690" width="6" height="50" rx="3"/><rect x="730" y="680" width="6" height="70" rx="3"/><rect x="742" y="698" width="6" height="34" rx="3"/><rect x="754" y="708" width="6" height="14" rx="3"/>
  </g>
  <rect x="573" y="660" width="3" height="110" rx="1.5" fill="#FFB020"/>

  <!-- destinations + meters -->
