  <rect x="918" y="696" width="108" height="36" rx="18" fill="#3DD6C6" fill-opacity="0.15" stroke="#3DD6C6"/>
  <text x="972" y="719" font-size="14" font-weight="700" fill="#3DD6C6" text-anchor="middle">Mic</text>
  <text x="1060" y="690" font-size="11" font-weight="700" fill="#8B90A0" letter-spacing="2">IN</text>
  <rect x="1060" y="698" width="180" height="8" rx="4" fill="#1A1D25"/><rect x="1060" y="698" width="104" height="8" rx="4" fill="#3DD6C6"/>
  <text x="1060" y="728" font-size="11" font-weight="700" fill="#8B90A0" letter-spacing="2">OUT</text>
  <rect x="1060" y="736" width="180" height="8" rx="4" fill="#1A1D25"/><rect x="1060" y="736" width="132" height="8" rx="4" fill="#FFB020"/>

  <text x="1256" y="788" font-size="11" fill="#5B6070" text-anchor="end">Concept preview, not the final UI</text>
