  <rect x="1136" y="11" width="120" height="28" rx="14" fill="#0D0E12" stroke="#262A34"/>
  <text x="1154" y="30" font-size="13" fill="#8B90A0">Latency 18 ms</text>

  <!-- sidebar -->
  <rect x="1" y="49" width="230" height="590" fill="#111318"/>
