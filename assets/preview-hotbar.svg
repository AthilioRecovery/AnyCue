<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="AnyCue concept preview: hotbar with sound pads">
  <defs>
    <g id="pad"><rect width="230" height="150" rx="14" fill="#1A1D25" stroke="#262A34" stroke-width="2"/></g>
    <g id="chip"><rect width="52" height="24" rx="7" fill="#0D0E12" stroke="#262A34"/></g>
  </defs>
  <rect width="1280" height="800" rx="16" fill="#0D0E12"/>
  <rect x="1" y="1" width="1278" height="798" rx="15" fill="none" stroke="#262A34" stroke-width="2"/>

  <!-- title bar -->
  <rect x="1" y="1" width="1278" height="48" rx="15" fill="#14161C"/>
  <rect x="1" y="30" width="1278" height="19" fill="#14161C"/>
  <circle cx="28" cy="25" r="6" fill="#262A34"/><circle cx="50" cy="25" r="6" fill="#262A34"/><circle cx="72" cy="25" r="6" fill="#262A34"/>
  <text x="104" y="31" font-size="17" font-weight="700" fill="#E8EAF0">AnyCue</text>
  <rect x="930" y="11" width="190" height="28" rx="14" fill="#0D0E12" stroke="#262A34"/>
  <circle cx="951" cy="25" r="5" fill="#3DD6C6"/>
