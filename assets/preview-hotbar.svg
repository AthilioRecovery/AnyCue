  <rect x="12" y="108" width="206" height="40" rx="10" fill="#1A1D25"/>
  <rect x="12" y="116" width="4" height="24" rx="2" fill="#FFB020"/>
  <text x="32" y="133" font-size="15" fill="#E8EAF0" font-weight="600">All sounds</text><text x="188" y="133" font-size="13" fill="#8B90A0" text-anchor="end">48</text>
  <text x="32" y="177" font-size="15" fill="#B7BBC8">Reactions</text><text x="188" y="177" font-size="13" fill="#8B90A0" text-anchor="end">12</text>
  <text x="32" y="217" font-size="15" fill="#B7BBC8">Stingers</text><text x="188" y="217" font-size="13" fill="#8B90A0" text-anchor="end">9</text>
  <text x="32" y="257" font-size="15" fill="#B7BBC8">Voice FX</text><text x="188" y="257" font-size="13" fill="#8B90A0" text-anchor="end">14</text>
  <text x="32" y="297" font-size="15" fill="#B7BBC8">Favorites</text><text x="188" y="297" font-size="13" fill="#8B90A0" text-anchor="end">7</text>
  <rect x="12" y="330" width="206" height="38" rx="10" fill="none" stroke="#262A34" stroke-dasharray="5 5"/>
